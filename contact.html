<button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">☰</button>
<nav id="site-nav" class="site-nav" data-collapsible>

    </div>

  <main id="main" class="container" style="padding:2rem 1rem;">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you. This form opens your email app to send us a message.</p>

   <form class="form" data-mailto>
  <label for="cname">Name</label>
  <input id="cname" name="name" type="text" autocomplete="name" required>

  <label for="cemail">Email</label>
  <input id="cemail" name="email" type="email" autocomplete="email" required>

  <label for="cmsg">Message</label>
  <textarea id="cmsg" name="message" rows="5" required></textarea>

  <!-- Honeypot -->
  <label class="visually-hidden" for="company">Company</label>
  <input id="company" name="company" type="text" autocomplete="organization" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;">

  <button class="btn btn-primary" type="submit">Send Email</button>
  <p class="form-hint">Or email us directly: <a href="mailto:CONTACT_EMAIL@example.com">CONTACT_EMAIL@example.com</a></p>
</form>
  </main>

  <footer class="site-footer">
    <div class="container legal">© <span id="year"></span> ROLL Foundation. All rights reserved.</div>
  </footer>

  <script>
    function openMailto(e){
      e.preventDefault();
      const name = encodeURIComponent(document.getElementById('cname').value.trim());
      const email = encodeURIComponent(document.getElementById('cemail').value.trim());
      const msg = encodeURIComponent(document.getElementById('cmsg').value.trim());
      const trap = document.getElementById('company').value.trim();
      if (trap) return false; // bot trap
      const subject = `Message from ${decodeURIComponent(name)} via ROLL Foundation site`;
      const body = `Name: ${decodeURIComponent(name)}%0AEmail: ${decodeURIComponent(email)}%0A%0A${decodeURIComponent(msg)}`;
      window.location.href = `mailto:CONTACT_EMAIL@example.com?subject=${encodeURIComponent(subject)}&body=${body}`;
      return false;
    }
  </script>
  <script defer src="./js/script.js"></script>
</body>
</html>
